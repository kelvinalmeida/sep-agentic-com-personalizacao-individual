<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — SEP_IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        html, body { height: 100%; margin: 0; }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .login-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.22);
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }

        /* Card header gradient */
        .card-header-gradient {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2.5rem 2.5rem 2rem;
            color: white;
            text-align: center;
        }
        .logo-circle {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: rgba(255,255,255,0.2);
            border: 2px solid rgba(255,255,255,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1rem;
        }
        .card-header-gradient h2 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .card-header-gradient p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin: 0;
        }

        /* Card body */
        .card-body-inner {
            padding: 2rem 2.5rem 2.5rem;
        }

        .form-label {
            font-size: 0.83rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 5px;
        }
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #e5e7eb;
            padding: 0.65rem 1rem;
            font-size: 0.95rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.15);
        }

        .input-icon-wrap {
            position: relative;
        }
        .input-icon-wrap .bi {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 1rem;
            pointer-events: none;
        }
        .input-icon-wrap .form-control {
            padding-left: 2.4rem;
        }

        .btn-login {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 0.97rem;
            width: 100%;
            transition: opacity 0.18s, transform 0.15s;
        }
        .btn-login:hover { opacity: 0.88; transform: translateY(-1px); color: white; }
        .btn-login:active { transform: translateY(0); }

        .btn-back {
            border: 1.5px solid #e5e7eb;
            color: #6b7280;
            background: transparent;
            border-radius: 12px;
            padding: 0.7rem;
            font-size: 0.9rem;
            font-weight: 500;
            width: 100%;
            text-decoration: none;
            display: block;
            text-align: center;
            transition: background 0.15s, border-color 0.15s;
        }
        .btn-back:hover { background: #f9fafb; border-color: #d1d5db; color: #374151; }

        .alert-error {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.87rem;
            margin-bottom: 1.25rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #d1d5db;
            font-size: 0.78rem;
            margin: 1rem 0;
        }
        .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: #e5e7eb; }
    </style>
</head>

<body>

<div class="login-card">

    <!-- Header -->
    <div class="card-header-gradient">
        <div class="logo-circle">
            <i class="bi bi-mortarboard-fill"></i>
        </div>
        <h2>SEP_IA</h2>
        <p>Sessões de Ensino Personalizadas</p>
    </div>

    <!-- Body -->
    <div class="card-body-inner">

        {% if error %}
        <div class="alert-error">
            <i class="bi bi-exclamation-circle-fill"></i>
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="username" class="form-label">Usuário</label>
                <div class="input-icon-wrap">
                    <i class="bi bi-person"></i>
                    <input type="text" class="form-control" id="username" name="username"
                           placeholder="Digite seu usuário" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Senha</label>
                <div class="input-icon-wrap">
                    <i class="bi bi-lock"></i>
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Digite sua senha" required>
                </div>
            </div>

            <button type="submit" class="btn-login mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Entrar
            </button>
        </form>

        <div class="divider">ou</div>

        <a href="/" class="btn-back">
            <i class="bi bi-arrow-left me-1"></i>Voltar para o início
        </a>

    </div>
</div>

</body>
</html>
